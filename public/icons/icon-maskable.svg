<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant: the logo is kept inside the safe zone (middle 80%) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171D"/>
      <stop offset="1" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBD48C"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8C6F1F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <g stroke="url(#gold)" stroke-width="30" stroke-linecap="round" fill="none">
      <line x1="176" y1="150" x2="320" y2="330"/>
      <line x1="336" y1="150" x2="192" y2="330"/>
    </g>
    <circle cx="162" cy="360" r="46" fill="none" stroke="url(#gold)" stroke-width="26"/>
    <circle cx="350" cy="360" r="46" fill="none" stroke="url(#gold)" stroke-width="26"/>
    <circle cx="256" cy="246" r="20" fill="#D4AF37"/>
  </g>
</svg>
