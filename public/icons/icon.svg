<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon: barber scissors + gold monogram on a dark background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171D"/>
      <stop offset="1" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBD48C"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8C6F1F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.7"/>
  <!-- Scissors -->
  <g stroke="url(#gold)" stroke-width="26" stroke-linecap="round" fill="none">
    <line x1="176" y1="150" x2="320" y2="330"/>
    <line x1="336" y1="150" x2="192" y2="330"/>
  </g>
  <circle cx="162" cy="360" r="44" fill="none" stroke="url(#gold)" stroke-width="24"/>
  <circle cx="350" cy="360" r="44" fill="none" stroke="url(#gold)" stroke-width="24"/>
  <circle cx="256" cy="246" r="18" fill="#D4AF37"/>
</svg>
